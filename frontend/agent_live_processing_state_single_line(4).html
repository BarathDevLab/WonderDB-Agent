<style> .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;} .spin{animation:spin 0.8s linear infinite;} @keyframes spin{to{transform:rotate(360deg);}} .pulse{animation:pulse 1.2s ease-in-out infinite;} @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}} </style> <h2 class="sr-only">Live view of a chatbot processing a query, showing each pipeline step activate in sequence with a running timer, then generating its response.</h2> <div style="background:var(--surface-2); border:0.5px solid var(--border); border-radius:12px; padding:1rem 1.25rem;"> <div style="display:flex; align-items:center; gap:8px; margin-bottom:14px;"> <span id="dot" class="pulse" style="width:8px; height:8px; border-radius:50%; background:var(--text-accent); flex-shrink:0;"></span> <span id="header-text" style="font-size:14px; font-weight:500;">Thinking</span> <span id="timer" style="font-size:12px; color:var(--text-muted); font-variant-numeric:tabular-nums;">0.0s</span> <div style="flex:1;"></div> <button id="stop-btn" style="border:none; background:transparent; color:var(--text-secondary); font-size:12px; display:flex; align-items:center; gap:4px; padding:4px 8px;" aria-label="Stop generating"> <i id="stop-icon" class="ti ti-player-stop" style="font-size:14px;" aria-hidden="true"></i><span id="stop-label">Stop</span> </button> </div> <div style="position:relative;"><div id="single-status" style="font-size:14px;color:var(--text-primary);min-height:24px;">Thinking</div></div> <div id="synth" style="display:none; padding-left:36px; margin-top:2px;"> <span class="pulse" style="font-size:13px; color:var(--text-secondary);">Generating response&#8230;</span> </div> </div> <script>(function(){var dot=document.getElementById("dot"),headerText=document.getElementById("header-text"),timerEl=document.getElementById("timer"),stopBtn=document.getElementById("stop-btn"),stopIcon=document.getElementById("stop-icon"),stopLabel=document.getElementById("stop-label"),synth=document.getElementById("synth"),status=document.getElementById("single-status"),timers=[],interval=null,startTime=0,stopped=false;function schedule(fn,ms){var id=setTimeout(fn,ms);timers.push(id);return id;}function clearTimers(){timers.forEach(clearTimeout);timers=[];}function runCycle(){clearTimers();stopped=false;synth.style.display="none";dot.className="pulse";dot.style.background="var(--text-accent)";headerText.textContent="Thinking";status.textContent="Thinking";startTime=Date.now();if(interval)clearInterval(interval);interval=setInterval(function(){timerEl.textContent=((Date.now()-startTime)/1000).toFixed(1)+"s";},100);var stages=["Thinking","Generating SQL...","Validating...","Data visualizing...","Summarizing..."];var i=0;function next(){if(stopped)return;i++;if(i<stages.length){status.textContent=stages[i];headerText.textContent=stages[i].replace(/\.{3}$/ ,"");schedule(next,900);}else{clearInterval(interval);synth.style.display="block";headerText.textContent="Generating";}}schedule(next,900);}stopBtn.addEventListener("click",function(){if(!stopped){stopped=true;clearTimers();if(interval)clearInterval(interval);dot.className="";dot.style.background="var(--text-muted)";headerText.textContent="Stopped";stopIcon.className="ti ti-refresh";stopLabel.textContent="Restart";stopBtn.setAttribute("aria-label","Restart generating");}else{stopIcon.className="ti ti-player-stop";stopLabel.textContent="Stop";stopBtn.setAttribute("aria-label","Stop generating");runCycle();}});runCycle();})();</script>
