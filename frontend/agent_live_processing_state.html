<style>
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.spin{animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.pulse{animation:pulse 1.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
</style>
<h2 class="sr-only">Live view of a chatbot processing a query, showing each pipeline step activate in sequence with a running timer, then generating its response.</h2>
<div style="background:var(--surface-2); border:0.5px solid var(--border); border-radius:12px; padding:1rem 1.25rem;">
  <div style="display:flex; align-items:center; gap:8px; margin-bottom:14px;">
    <span id="dot" class="pulse" style="width:8px; height:8px; border-radius:50%; background:var(--text-accent); flex-shrink:0;"></span>
    <span id="header-text" style="font-size:14px; font-weight:500;">Thinking</span>
    <span id="timer" style="font-size:12px; color:var(--text-muted); font-variant-numeric:tabular-nums;">0.0s</span>
    <div style="flex:1;"></div>
    <button id="stop-btn" style="border:none; background:transparent; color:var(--text-secondary); font-size:12px; display:flex; align-items:center; gap:4px; padding:4px 8px;" aria-label="Stop generating">
      <i id="stop-icon" class="ti ti-player-stop" style="font-size:14px;" aria-hidden="true"></i><span id="stop-label">Stop</span>
    </button>
  </div>

  <div style="position:relative;">
    <div style="position:absolute; left:11px; top:12px; bottom:12px; width:1px; background:var(--border);"></div>

    <div class="step" data-idx="0" style="display:flex; align-items:flex-start; gap:12px; padding:6px 0; position:relative;">
      <div style="width:24px; height:24px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <i class="step-icon ti ti-circle-dashed" style="font-size:15px; color:var(--text-muted);" aria-hidden="true"></i>
      </div>
      <div style="flex:1; padding-top:2px;">
        <div class="step-label" style="font-size:14px; color:var(--text-muted);">Fetching schema</div>
        <div class="step-sub" style="font-size:12px; color:var(--text-muted); margin-top:2px;"></div>
      </div>
    </div>

    <div class="step" data-idx="1" style="display:flex; align-items:flex-start; gap:12px; padding:6px 0; position:relative;">
      <div style="width:24px; height:24px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <i class="step-icon ti ti-circle-dashed" style="font-size:15px; color:var(--text-muted);" aria-hidden="true"></i>
      </div>
      <div style="flex:1; padding-top:2px;">
        <div class="step-label" style="font-size:14px; color:var(--text-muted);">Generating and validating query</div>
        <div class="step-sub" style="font-size:12px; color:var(--text-muted); margin-top:2px;"></div>
      </div>
    </div>

    <div class="step" data-idx="2" style="display:flex; align-items:flex-start; gap:12px; padding:6px 0; position:relative;">
      <div style="width:24px; height:24px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <i class="step-icon ti ti-circle-dashed" style="font-size:15px; color:var(--text-muted);" aria-hidden="true"></i>
      </div>
      <div style="flex:1; padding-top:2px;">
        <div class="step-label" style="font-size:14px; color:var(--text-muted);">Executing query</div>
        <div class="step-sub" style="font-size:12px; color:var(--text-muted); margin-top:2px;"></div>
      </div>
    </div>

    <div class="step" data-idx="3" style="display:flex; align-items:flex-start; gap:12px; padding:6px 0; position:relative;">
      <div style="width:24px; height:24px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <i class="step-icon ti ti-circle-dashed" style="font-size:15px; color:var(--text-muted);" aria-hidden="true"></i>
      </div>
      <div style="flex:1; padding-top:2px;">
        <div class="step-label" style="font-size:14px; color:var(--text-muted);">Rendering visualization</div>
        <div class="step-sub" style="font-size:12px; color:var(--text-muted); margin-top:2px;"></div>
      </div>
    </div>
  </div>

  <div id="synth" style="display:none; padding-left:36px; margin-top:2px;">
    <span class="pulse" style="font-size:13px; color:var(--text-secondary);">Generating response&#8230;</span>
  </div>
</div>
<script>
(function(){
  var steps = Array.prototype.slice.call(document.querySelectorAll('.step'));
  var dot = document.getElementById('dot');
  var headerText = document.getElementById('header-text');
  var timerEl = document.getElementById('timer');
  var stopBtn = document.getElementById('stop-btn');
  var stopIcon = document.getElementById('stop-icon');
  var stopLabel = document.getElementById('stop-label');
  var synth = document.getElementById('synth');

  var subLabels = {
    active: ['Running get_schema\u2026', 'Running AST & EXPLAIN gate\u2026', 'Running execute_query\u2026', 'Running generate_chart\u2026'],
    done: ['get_schema \u00b7 340ms', 'cost 0.00 \u00b7 validated', '7 rows \u00b7 890ms', 'line chart \u00b7 610ms']
  };

  var timers = [];
  var interval = null;
  var startTime = 0;
  var stopped = false;

  function setStep(i, state){
    var s = steps[i];
    var icon = s.querySelector('.step-icon');
    var label = s.querySelector('.step-label');
    var sub = s.querySelector('.step-sub');
    if(state === 'pending'){
      icon.className = 'step-icon ti ti-circle-dashed';
      icon.style.color = 'var(--text-muted)';
      label.style.color = 'var(--text-muted)';
      label.style.fontWeight = '400';
      sub.textContent = '';
    } else if(state === 'active'){
      icon.className = 'step-icon ti ti-loader-2 spin';
      icon.style.color = 'var(--text-accent)';
      label.style.color = 'var(--text-primary)';
      label.style.fontWeight = '500';
      sub.textContent = subLabels.active[i];
    } else if(state === 'done'){
      icon.className = 'step-icon ti ti-circle-check';
      icon.style.color = 'var(--text-success)';
      label.style.color = 'var(--text-primary)';
      label.style.fontWeight = '400';
      sub.textContent = subLabels.done[i];
    }
  }

  function schedule(fn, ms){
    var id = setTimeout(fn, ms);
    timers.push(id);
    return id;
  }

  function clearTimers(){
    timers.forEach(clearTimeout);
    timers = [];
  }

  function resetUI(){
    steps.forEach(function(s, i){ setStep(i, 'pending'); });
    synth.style.display = 'none';
    dot.className = 'pulse';
    dot.style.background = 'var(--text-accent)';
    headerText.textContent = 'Thinking';
  }

  function runCycle(){
    stopped = false;
    resetUI();
    startTime = Date.now();
    if(interval) clearInterval(interval);
    interval = setInterval(function(){
      var elapsed = (Date.now() - startTime) / 1000;
      timerEl.textContent = elapsed.toFixed(1) + 's';
    }, 100);

    setStep(0, 'active');
    schedule(function(){ setStep(0, 'done'); setStep(1, 'active'); }, 700);
    schedule(function(){ setStep(1, 'done'); setStep(2, 'active'); }, 1500);
    schedule(function(){ setStep(2, 'done'); setStep(3, 'active'); }, 2300);
    schedule(function(){
      setStep(3, 'done');
      synth.style.display = 'block';
      headerText.textContent = 'Generating';
    }, 2900);
    schedule(function(){
      clearInterval(interval);
      if(!stopped) runCycle();
    }, 4300);
  }

  stopBtn.addEventListener('click', function(){
    if(!stopped){
      stopped = true;
      clearTimers();
      if(interval) clearInterval(interval);
      dot.className = '';
      dot.style.background = 'var(--text-muted)';
      headerText.textContent = 'Stopped';
      stopIcon.className = 'ti ti-refresh';
      stopLabel.textContent = 'Restart';
      stopBtn.setAttribute('aria-label', 'Restart generating');
    } else {
      stopIcon.className = 'ti ti-player-stop';
      stopLabel.textContent = 'Stop';
      stopBtn.setAttribute('aria-label', 'Stop generating');
      runCycle();
    }
  });

  runCycle();
})();
</script>
