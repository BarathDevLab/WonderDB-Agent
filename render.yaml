# ===================================================
# Render Free Plan - Backend Web Service (render.yaml)
# ===================================================

services:
  - type: web
    name: ai-agent-backend
    runtime: python
    region: singapore # Options: oregon, frankfurt, singapore, ohio
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python scripts/init_and_seed_db.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir src
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        sync: false # Set your PostgreSQL connection URL (e.g. from Render Postgres, Neon, or Supabase)
      - key: REDIS_URL
        sync: false # Set your Redis connection URL (e.g. redis://... or Upstash Redis URL)
      - key: GEMINI_API_KEY
        sync: false # Set your Google Gemini API Key
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: text-embedding-004
      - key: ENABLE_SEMANTIC_CACHE
        value: "true"
