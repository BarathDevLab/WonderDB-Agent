[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ai-database-assistant"
version = "0.1.0"
description = "Enterprise Text-to-SQL platform using LangGraph, FastAPI, and SSE."
authors = ["Engineering Team <dev@company.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
langgraph = ">=0.2.0"
langchain-core = "^0.1.30"
asyncpg = "^0.29.0"
sqlglot = "^23.0.0"
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
redis = "^5.0.0"
tiktoken = "^0.6.0"
httpx = ">=0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
ruff = "^0.3.0"